[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raccoonbot-vision-three-in-a-row"
version = "0.1.0"
description = "Camera-driven moving three-in-a-row game with RaccoonBot"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Repository = "https://github.com/Anhyeonseo/Raccoonbot-Vision-Three-in-a-row"

[project.scripts]
raccoonbot-booth = "raccoonbot_game.tools.booth_demo:main"
raccoonbot-sim = "raccoonbot_game.tools.simulate_game:main"
raccoonbot-calibrate = "raccoonbot_game.tools.create_calibration:main"
raccoonbot-inspect = "raccoonbot_game.tools.inspect_board_image:main"
raccoonbot-live = "raccoonbot_game.tools.live_board:main"
raccoonbot-probe-robot = "raccoonbot_game.tools.probe_robot:main"
raccoonbot-smoke-motion = "raccoonbot_game.tools.smoke_test_motion:main"
raccoonbot-smoke-gripper = "raccoonbot_game.tools.smoke_test_gripper:main"
raccoonbot-teach-pose = "raccoonbot_game.tools.teach_pose:main"
raccoonbot-smoke-transition = "raccoonbot_game.tools.smoke_test_transition:main"
raccoonbot-smoke-pick = "raccoonbot_game.tools.smoke_test_pick:main"
raccoonbot-smoke-transfer = "raccoonbot_game.tools.smoke_test_transfer:main"
raccoonbot-smoke-cell-sweep = "raccoonbot_game.tools.smoke_test_cell_sweep:main"
raccoonbot-play-hardware = "raccoonbot_game.tools.play_hardware:main"
raccoonbot-web = "raccoonbot_game.tools.web_hardware:main"
raccoonbot-synthetic = "raccoonbot_game.tools.generate_synthetic_data:main"
raccoonbot-validate-poses = "raccoonbot_game.tools.validate_pose_profile:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raccoonbot_game = ["web/*.html", "web/*.css", "web/*.js"]
